apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  nginx.conf: |
    events {}

    http {
        map $http_upgrade $connection_upgrade {
            default upgrade;
            '' close;
        }

        server {
            listen 80;

            # Comments service
            location ~ ^/posts/.+/comments {
                proxy_pass http://comments:5001;
            }

            # Posts - writes go to posts service, reads go to query service
            location = /posts {
                if ($request_method = POST) {
                    proxy_pass http://posts:5000;
                }
                proxy_pass http://query:5002;
            }

            # Auth
            location /auth/ {
                proxy_pass http://auth:5006/;
            }

            # Frontend
            location / {
                proxy_pass http://client:5173;

                # Required for Vite (WebSockets / HMR)
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;

                # Standard headers
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            }
        }
    }