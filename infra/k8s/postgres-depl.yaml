apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  selector:
    matchLabels:
      app: postgres
  serviceName: postgres
  replicas: 1
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18.3
          env:
            - name: POSTGRES_DB
              value: dist_app
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTS_DB_USER
            - name: POSTS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTS_DB_PASSWORD
            - name: DUMMY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DUMMY_USERNAME
            - name: DUMMY_PASSWORD_HASHED
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DUMMY_PASSWORD_HASHED
            - name: PGDATA
              value: /opt/dist_app_db_postgres/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-data
              mountPath: /opt/dist_app_db_postgres
            - name: postgres-initdb
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: postgres-initdb
          configMap:
            name: postgres-initdb
            defaultMode: 0755
