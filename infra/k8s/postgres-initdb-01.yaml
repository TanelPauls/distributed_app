apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-initdb
data:
  01_roles.sh: |
    #!/bin/bash
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
      REVOKE CREATE ON SCHEMA public FROM PUBLIC;
      REVOKE ALL ON SCHEMA public FROM PUBLIC;

      CREATE SCHEMA IF NOT EXISTS dist_app;

      DO \$body\$
      BEGIN
        IF NOT EXISTS (
          SELECT FROM pg_catalog.pg_roles WHERE rolname = '$POSTS_DB_USER'
        ) THEN
          CREATE ROLE $POSTS_DB_USER
            LOGIN
            PASSWORD '$POSTS_DB_PASSWORD'
            NOSUPERUSER
            NOCREATEDB
            NOCREATEROLE
            NOINHERIT;
        END IF;
      END
      \$body\$;

      GRANT USAGE ON SCHEMA dist_app TO $POSTS_DB_USER;
      GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA dist_app TO $POSTS_DB_USER;
      ALTER DEFAULT PRIVILEGES IN SCHEMA dist_app
        GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO $POSTS_DB_USER;
    EOSQL

  02_posts.sh: |
    #!/bin/bash
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
      CREATE TABLE IF NOT EXISTS dist_app.posts (
        id         UUID        PRIMARY KEY DEFAULT gen_random_uuid(),
        title      TEXT        NOT NULL,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
      );
    EOSQL

  03_comments.sh: |
    #!/bin/bash
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
      CREATE TABLE IF NOT EXISTS dist_app.comments (
        id         UUID        PRIMARY KEY DEFAULT gen_random_uuid(),
        post_id    UUID        NOT NULL REFERENCES dist_app.posts(id) ON DELETE CASCADE,
        content    TEXT        NOT NULL,
        status     TEXT        NOT NULL DEFAULT 'pending',
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
      );
    EOSQL

  04_users.sh: |
    #!/bin/bash
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
      CREATE TABLE IF NOT EXISTS dist_app.users (
        id         UUID        PRIMARY KEY DEFAULT gen_random_uuid(),
        email      TEXT        NOT NULL UNIQUE,
        password   TEXT        NOT NULL,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
      );
    EOSQL

  05_add_dummy_user.sh: |
    #!/bin/bash
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
      INSERT INTO dist_app.users (email, password)
      VALUES ('$DUMMY_USERNAME', '$DUMMY_PASSWORD_HASHED')
      ON CONFLICT (email) DO NOTHING;
    EOSQL