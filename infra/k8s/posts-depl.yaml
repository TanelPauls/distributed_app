apiVersion: apps/v1
kind: Deployment
metadata: 
  name: posts-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: posts
  template:
    metadata:
      labels:
        app: posts
    spec:
      containers:
        - name: posts
          image: tanelpauls/distributed_app_posts
          env:
            - name: POSTS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTS_DB_USER
            - name: POSTS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTS_DB_PASSWORD