apiVersion: apps/v1
kind: Deployment
metadata: 
  name: query-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: query
  template:
    metadata:
      labels:
        app: query
    spec:
      containers:
        - name: query
          image: tanelpauls/distributed_app_query
          env:
            - name: POSTS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTS_DB_USER
            - name: POSTS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTS_DB_PASSWORD